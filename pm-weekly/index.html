<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>需求组周报</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#141b26;--sub:#5b6678;--muted:#98a2b3;--line:#e8ecf2;--accent:#0f5bd8;--good:#0b7a5c;--warn:#a8630f;--bad:#b42318;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.05)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(900px 420px at 12% -6%,#e9f0fb 0%,rgba(233,240,251,0) 60%),var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:940px;margin:0 auto;padding:56px 24px 64px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
h1{margin:0;font-size:34px;line-height:1.2;letter-spacing:-.02em;font-weight:700}
.period{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:var(--shadow);font-size:13px;color:var(--sub)}
.period b{font-size:15px;color:var(--ink)}
.period .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,#dbe6f7,#f1f4f9)}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;font-weight:600;color:var(--sub);margin-left:2px}
.stat .l{margin-top:6px;font-size:12.5px;color:var(--sub)}
.stat .hint{margin-top:2px;font-size:11.5px;color:var(--muted)}
.stat .v.zero{color:#b3bccb}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px 20px;box-shadow:var(--shadow);margin-bottom:18px}
.card-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
h2{margin:0;font-size:16px;letter-spacing:-.01em}
.cap{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{padding:14px 10px;text-align:left;vertical-align:middle}
th{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.04em;border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid #f1f3f7}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#fbfcfe}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.name{font-weight:600}
.sp{font-size:18px;font-weight:700;letter-spacing:-.01em}
.sp.zero{color:#b3bccb}
.den{font-size:11.5px;color:var(--muted);margin-left:6px}
.rate{display:inline-flex;align-items:center;gap:6px;justify-content:flex-end;font-variant-numeric:tabular-nums;font-weight:600}
.rate i{width:7px;height:7px;border-radius:50%;display:inline-block}
.good i{background:var(--good)} .good{color:var(--good)}
.warn i{background:var(--warn)} .warn{color:var(--warn)}
.bad i{background:var(--bad)} .bad{color:var(--bad)}
.muted{color:var(--muted)}
.roi-person{display:grid;grid-template-columns:104px 1fr;gap:18px;padding:16px 0;border-top:1px solid #f1f3f7}
.roi-person:first-child{border-top:none;padding-top:6px}
.roi-who{font-weight:600;font-size:13.5px;color:var(--ink);padding-top:2px}
.roi-who span{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.roi-list{display:flex;flex-direction:column;gap:9px}
.roi-row{display:grid;grid-template-columns:1fr 64px 74px;align-items:center;gap:12px}
.rname{font-size:13px;color:#3d4859;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:relative;height:8px;background:#f2f4f8;border-radius:4px;margin-top:3px}
.bar .zero-line{position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:#d8dee8}
.bar .fill{position:absolute;top:0;height:8px;border-radius:4px}
.bar .fill.pos{left:50%;background:linear-gradient(90deg,#3aa88a,#0b7a5c)}
.bar .fill.neg{right:50%;background:linear-gradient(90deg,#e5705f,#b42318)}
.roi-val{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:13.5px}
.eff{text-align:right;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{margin-top:22px;font-size:11.5px;line-height:1.9;color:var(--muted)}
.loading{padding:80px 0;text-align:center;color:var(--muted);font-size:14px}
@media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:26px}.roi-person{grid-template-columns:1fr;gap:8px}table{font-size:13px}th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="wrap"><div id="app"><div class="loading">正在读取周报数据…</div></div></div>
<script>
window.WEEKLY_DATA = {

  "generated_at": "2026-11-12 19:57",
  "asof": "2026-11-12",

      { "name": "汶阳田灌区支撑平台", "roi": 37.0, "eff": 0.3, "sp": 20.0, "cost_h": 614.0 } ] },
    { "name": "王立杰", "sp_cycle": 0.0, "sp28": 19.0, "pending_sp": 75.0, "pending_n": 3, "g_done": 2, "g_late": 0, "g_rate": 0.0, "p_done": 20, "p_late": 0, "p_rate": 0.0, "recent": "10-28「管理端」5 SP", "projects": [
      { "name": "智慧监造单机版", "roi": 42.0, "eff": 0.3, "sp": 3.0, "cost_h": 90.0 },
      { "name": "材料检测虚拟仿真", "roi": -24.0, "eff": 0.1, "sp": 13.0, "cost_h": 711.5 },
      { "name": "需求管理", "roi": 184.0, "eff": 0.5, "sp": 18.0, "cost_h": 268.0 },
      { "name": "竞价辅助工具", "roi": 92.0, "eff": 0.4, "sp": 82.0, "cost_h": 1778.0 } ] },

      { "name": "GEO", "roi": 2.0, "eff": 0.2, "sp": 24.0, "cost_h": 985.0 } ] },
    { "name": "翁晓茹", "sp_cycle": 0.0, "sp28": 0, "pending_sp": 0, "pending_n": 0, "g_done": 2, "g_late": 0, "g_rate": 0.0, "p_done": 14, "p_late": 0, "p_rate": 0.0, "recent": "09-14「模型管理」5 SP", "projects": [
      { "name": "Token中转站", "roi": 80.0, "eff": 0.3, "sp": 28.0, "cost_h": 653.0 },
      { "name": "OA", "roi": 130.0, "eff": 0.4, "sp": 19.0, "cost_h": 345.0 } ] },
    { "name": "孔岚平", "sp_cycle": 0.0, "sp28": 30.0, "pending_sp": 125.0, "pending_n": 9, "g_done": 1, "g_late": 0, "g_rate": 0.0, "p_done": 14, "p_late": 0, "p_rate": 0.0, "recent": "10-20「沙盘主体设计与搭建系统底座」30 SP", "projects": [

  ],
  "latest_summary": "丁敬洋 10-14「基础环境底板」4 SP；王立杰 10-28「管理端」5 SP；林子涵 07-30「智谱模型新增和功能迭代」1 SP；翁晓茹 09-14「模型管理」5 SP；孔岚平 10-20「沙盘主体设计与搭建系统底座」30 SP"
};
</script>
<script>
(function () {
  var D = window.WEEKLY_DATA;
  var app = document.getElementById('app');
  if (!D) { app.innerHTML = '<div class="loading">数据未加载</div>'; return; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fmt(v) { if (v == null) return '—'; var f = Number(v); return Math.abs(f - Math.round(f)) < 1e-9 ? String(Math.round(f)) : f.toFixed(1); }
  function rateCls(r) { return r >= 30 ? 'bad' : (r > 0 ? 'warn' : 'good'); }
  var T = D.totals;
  var head = '<div class="head"><div><div class="eyebrow">WEEKLY · 需求管理组</div><h1>需求组周报</h1></div>' +
    '<div class="period"><span class="dot"></span><span><b>' + esc(D.cycle.label) + '</b>　' + esc(D.cycle.start) + ' — ' + esc(D.cycle.end) + '</span></div></div>';
  var stats = '<div class="stats">' +
    '<div class="stat"><div class="v' + (T.sp_cycle ? '' : ' zero') + '">' + fmt(T.sp_cycle) + '</div><div class="l">本周期交付 SP</div><div class="hint">' + esc(D.cycle.start) + '—' + esc(D.cycle.end) + '</div></div>' +
    '<div class="stat"><div class="v">' + fmt(T.sp28) + '</div><div class="l">近 28 天交付 SP</div><div class="hint">截至 ' + esc(D.asof) + '</div></div>' +
    '<div class="stat"><div class="v">' + fmt(T.pending_sp) + '</div><div class="l">在途 SP</div><div class="hint">' + T.pending_n + ' 个未完成目标</div></div>' +
    '<div class="stat"><div class="v">' + T.g_rate.toFixed(1) + '<small>%</small></div><div class="l">本周期目标延期率</div><div class="hint">' + T.g_late + ' / ' + T.g_done + ' 条已完成</div></div></div>';
  var rows = D.people.map(function (p) {
    return '<tr><td class="name">' + esc(p.name) + '</td>' +
      '<td class="num"><span class="sp' + (p.sp_cycle ? '' : ' zero') + '">' + fmt(p.sp_cycle) + '</span></td>' +
      '<td class="num">' + fmt(p.sp28) + '</td>' +
      '<td class="num">' + fmt(p.pending_sp) + '<span class="den">' + p.pending_n + ' 个</span></td>' +
      '<td class="num"><span class="rate ' + rateCls(p.g_rate) + '"><i></i>' + p.g_rate.toFixed(0) + '%</span><span class="den">' + p.g_late + '/' + p.g_done + '</span></td>' +
      '<td class="num"><span class="rate ' + rateCls(p.p_rate) + '"><i></i>' + p.p_rate.toFixed(0) + '%</span><span class="den">' + p.p_late + '/' + p.p_done + '</span></td></tr>';
  }).join('');
  var tableCard = '<div class="card"><div class="card-title"><h2>五人重点数据</h2><span class="cap">延期率按本周期已完成记录计算，晚于承诺 60 分钟内不计</span></div>' +
    '<table><thead><tr><th>姓名</th><th class="num">本周期 SP</th><th class="num">近 28 天</th><th class="num">在途</th><th class="num">目标延期率</th><th class="num">推进力延期率</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  var maxAbs = 1;
  D.people.forEach(function (p) { (p.projects || []).forEach(function (q) { maxAbs = Math.max(maxAbs, Math.abs(q.roi)); }); });
  var roiBlocks = D.people.map(function (p) {
    var list = (p.projects || []);
    var body = list.length ? list.map(function (q) {
      var pos = q.roi >= 0;
      var w = Math.max(2, Math.abs(q.roi) / maxAbs * 50);
      var fill = pos ? '<span class="fill pos" style="width:' + w + '%"></span>' : '<span class="fill neg" style="width:' + w + '%"></span>';
      return '<div class="roi-row"><div><div class="rname" title="' + esc(q.name) + '">' + esc(q.name) + '</div>' +
        '<div class="bar"><span class="zero-line"></span>' + fill + '</div></div>' +
        '<div class="roi-val ' + (pos ? 'good' : 'bad') + '">' + (pos ? '+' : '') + Math.round(q.roi) + '%</div>' +
        '<div class="eff">' + (q.eff == null ? '—' : Number(q.eff).toFixed(2)) + ' SP/d</div></div>';
    }).join('') : '<div class="muted" style="font-size:12.5px">系统内暂无 ROI 记录</div>';
    return '<div class="roi-person"><div class="roi-who">' + esc(p.name) + '<span>' + list.length + ' 个项目</span></div><div class="roi-list">' + body + '</div></div>';
  }).join('');
  var roiCard = '<div class="card"><div class="card-title"><h2>投入产出比与人效</h2><span class="cap">ROI =（交付 SP × 41.8 − 投入工时）/ 投入工时，按项目累计</span></div><div style="margin-top:8px">' + roiBlocks + '</div></div>';
  var foot = '<div class="foot">SP 只计「已完成且 SP&gt;0」的目标，时间取目标最后更新时间。本周期无带 SP 的目标完成，最近一次：' +
    esc(D.latest_summary) + '。<br>生成时间 ' + esc(D.generated_at) + '　|　数据源：PM 系统接口　|　ROI 仅覆盖系统内有记录的项目</div>';
  app.innerHTML = head + stats + tableCard + roiCard + foot;
})();
</script>
</body>
</html>
